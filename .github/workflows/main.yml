name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android project structure
        run: |
          mkdir -p app/src/main/java/com/example/mudeercards app/src/main/res/values app/src/main/assets

          [ -f "index.html" ] && cp "index.html" "app/src/main/assets/index.html"
          [ -f "pdf.min.js" ] && cp "pdf.min.js" "app/src/main/assets/pdf.min.js"
          [ -f "pdf.worker.min.js" ] && cp "pdf.worker.min.js" "app/src/main/assets/pdf.worker.min.js"

          [ -f "AndroidManifest.xml" ] && cp "AndroidManifest.xml" "app/src/main/AndroidManifest.xml"
          if [ -f "MainActivity.java" ]; then
            grep -q "^package " "MainActivity.java" || sed -i '1s/^/package com.example.mudeercards;\n/' "MainActivity.java"
            cp "MainActivity.java" "app/src/main/java/com/example/mudeercards/MainActivity.java"
          fi

          [ -f "colors.xml" ] && cp "colors.xml" "app/src/main/res/values/colors.xml"

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MudeerCards"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.mudeercards'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.mudeercards"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          if [ -d "/usr/local/lib/android/sdk" ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          fi

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
