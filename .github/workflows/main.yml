name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Assemble project
        run: |
          ROOT_DIR="$GITHUB_WORKSPACE"
          ASSETS_DIR="$ROOT_DIR/app/src/main/assets"
          mkdir -p "$ASSETS_DIR"

          if [ -f "$ROOT_DIR/index.html" ]; then
            cp "$ROOT_DIR/index.html" "$ASSETS_DIR/index.html"
          elif [ -f "$ROOT_DIR/app/src/main/index.html" ]; then
            cp "$ROOT_DIR/app/src/main/index.html" "$ASSETS_DIR/index.html"
          else
            echo "Error: index.html not found!"
            exit 1
          fi

          [ -f "$ROOT_DIR/pdf.min.js" ] && cp "$ROOT_DIR/pdf.min.js" "$ASSETS_DIR/pdf.min.js"
          [ -f "$ROOT_DIR/pdf.worker.min.js" ] && cp "$ROOT_DIR/pdf.worker.min.js" "$ASSETS_DIR/pdf.worker.min.js"

      - name: Build APK
        working-directory: ${{ github.workspace }}
        run: |
          GW_PATH=$(find . -maxdepth 3 -name "gradlew" -type f | head -n 1)
          if [ -n "$GW_PATH" ]; then
            GW_DIR=$(dirname "$GW_PATH")
            chmod +x "$GW_PATH"
            (cd "$GW_DIR" && ./gradlew assembleDebug)
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
 
